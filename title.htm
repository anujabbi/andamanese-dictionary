<script>
(function () {
  function get(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } }
  function set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
  function readFilter(){ var v=get('ga.filter'); return (v==='etym'||v==='morph')?v:''; }
  function etymSource(v){ return v ? String(v).split(/[;,]/)[0].trim() : ''; }

  var tag = document.getElementById('ga-scope');
  var valSel = document.getElementById('ga-scope-value');
  if (!tag) return;

  function reloadFrames(){
    var names=['basefrm','indexframe'];
    for (var i=0;i<names.length;i++){
      try { var fr=parent[names[i]];
        if (fr && fr.location && typeof fr.location.reload==='function') fr.location.reload();
      } catch(e){}
    }
  }
  function showVal(show){ if (valSel) valSel.hidden = !show; }
  function populateValues(sources){
    if (!valSel) return;
    var cur = get('ga.filter.value');
    valSel.innerHTML='';
    var o0=document.createElement('option'); o0.value=''; o0.textContent='All sources'; valSel.appendChild(o0);
    for (var i=0;i<sources.length;i++){
      var o=document.createElement('option'); o.value=sources[i]; o.textContent=sources[i]; valSel.appendChild(o);
    }
    valSel.value = cur;
  }

  tag.value = readFilter();
  showVal(tag.value === 'etym');
  fetch('assets/search-index.json').then(function(r){return r.json();}).then(function(index){
    var set2={};
    for (var i=0;i<index.length;i++){ var e=index[i]; if(e.etym){ var sgg=etymSource(e.etym); if(sgg) set2[sgg]=1; } }
    populateValues(Object.keys(set2).sort());
  }).catch(function(){});

  tag.addEventListener('change', function(){
    var v=(tag.value==='etym'||tag.value==='morph')?tag.value:'';
    set('ga.filter', v);
    set('ga.filter.value', '');
    if (valSel) valSel.value='';
    showVal(v==='etym');
    reloadFrames();
  });
  if (valSel) valSel.addEventListener('change', function(){
    set('ga.filter.value', valSel.value || '');
    reloadFrames();
  });
})();
</script>
