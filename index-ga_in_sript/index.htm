<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devanagari → Great Andamanese</title>
<link rel="stylesheet" href="../stylesheets/lexiquepro.css" type="text/css" />
<link rel="stylesheet" href="../assets/cards.css" type="text/css" />
<link rel="stylesheet" href="../assets/chrome.css" type="text/css" />
<script src="../assets/cards.js" defer></script>
<script src="../assets/browse.js" defer></script>
<script>window.GA_PAGE={section:'devanagari',base:'../'};</script>
<script src="../assets/chrome.js" defer></script>
</head>
<body>
<div class="layout">
  <aside class="idx">
    <div class="ttl">Browse by Devanagari spelling</div>
    <nav class="ilist" id="ilist"></nav>
  </aside>
  <div class="pane" id="pane"><div class="hint">Pick a term on the left to see its entry.</div></div>
</div>
<script>
  document.addEventListener('ga:chromeready', function () {
    window.GABrowse.initIndexPage({ base: '../', section: 'devanagari', scripts: [
      { key: 'dev', label: 'देव', mode: 'native' },
      { key: 'ipa', label: 'a–z', mode: 'alt', requires: 'deva', termField: 'deva', groupBy: 'file', order: 'ipa', sortKey: 'ipa' }
    ]});
  });
</script>
</body></html>
